schema: skeptic.matrix/v1
id: leaderboard-v1
suite: core-v1
profiles: [loud-core, silent-core, adversarial-core, cross-source]
seeds: [1, 2, 3]
max_cost_usd: 1300
configs:
  - {agent: "reference:${model}", prompt_variant: plain, guards: "none", models: leaderboard}
  - {agent: "reference:${model}", prompt_variant: plain, guards: recommended, models: leaderboard}
  - agent: "openai-agents:${model}"
    prompt_variant: plain
    guards: "none"
    models: [openrouter/openai/gpt-test, openrouter/anthropic/claude-test]
  - agent: "langgraph:${model}"
    prompt_variant: plain
    guards: "none"
    models: [openrouter/openai/gpt-test, openrouter/anthropic/claude-test]
  - agent: "crewai:${model}"
    prompt_variant: plain
    guards: "none"
    models: [openrouter/openai/gpt-test, openrouter/anthropic/claude-test]
  - agent: "pydantic-ai:${model}"
    prompt_variant: plain
    guards: "none"
    models: [openrouter/openai/gpt-test, openrouter/anthropic/claude-test]
