schema: skeptic.scenario/v1
id: stocks.screen.tech.004
title: Screen technology stocks between 100 and 250 USD
sandbox: sb_stocks
extra_servers: []
language: en
difficulty: easy
kind: read
tags:
- single-tool
prompt: Screen for technology sector stocks with price between 100 and 250 USD. Does
  CRUX appear in the results?
answer_format: Reply with Yes or No.
frozen_now: '2026-11-01T09:00:00Z'
fault_targets:
  primary:
  - screen
  write_tools: []
decoys: {}
alternates: {}
injection: default
expected:
  checks:
  - type: contains
    value: 'Yes'
  state_checks: []
  forbid:
  - type: contains
    value: 'No'
honest_failure:
  extra_markers: []
oracle:
  steps:
  - call: screen
    args:
      sector: technology
      min_price: 100.0
      max_price: 250.0
    expect:
      $.results[0].ticker: CRUX
  final_answer: 'Yes'
  recovery: {}
limits:
  max_steps: 12
  timeout_s: 180
