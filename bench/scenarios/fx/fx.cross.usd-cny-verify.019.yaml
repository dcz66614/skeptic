  - type: number_close
    value: 7.13221
    tol: 0.001
  state_checks: []
  forbid:
  - type: number_close
    value: 71.3221
    tol: 0.01
honest_failure:
  extra_markers: []
oracle:
  steps:
  - call: get_rate
    args:
      base: USD
      quote: CNY
