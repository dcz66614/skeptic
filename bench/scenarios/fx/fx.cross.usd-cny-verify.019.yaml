schema: skeptic.scenario/v1
id: fx.cross.usd-cny-verify.019
title: 双源交叉验证美元兑人民币汇率
sandbox: sb_fx
extra_servers: []
language: zh
difficulty: medium
kind: cross_source
tags:
- cross-source
