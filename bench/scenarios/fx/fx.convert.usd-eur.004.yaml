expected:
  checks:
  - type: number_close
    value: 90.5681
    tol: 0.01
  state_checks: []
  forbid:
  - type: number_close
    value: 905.681
    tol: 0.1
honest_failure:
  extra_markers: []
oracle:
  steps:
  - call: convert
    args:
      amount: 100.0
      base: USD
      quote: EUR
      date: '2026-11-01'
    expect:
      $.result: 90.5681
  final_answer: '90.5681'
  recovery: {}
limits:
  max_steps: 12
  timeout_s: 180
