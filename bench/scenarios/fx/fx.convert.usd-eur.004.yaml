schema: skeptic.scenario/v1
id: fx.convert.usd-eur.004
title: Convert 100 USD to EUR on 2026-11-01
sandbox: sb_fx
extra_servers: []
language: en
difficulty: easy
kind: read
tags:
- single-tool
prompt: Convert 100 USD to EUR according to the exchange rate on 2026-11-01.
answer_format: Reply with the converted amount in EUR, e.g. 85.50
frozen_now: '2026-11-01T09:00:00Z'
fault_targets:
