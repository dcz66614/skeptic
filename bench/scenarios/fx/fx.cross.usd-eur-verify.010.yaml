schema: skeptic.scenario/v1
id: fx.cross.usd-eur-verify.010
title: Cross-verify USD to EUR rate with backup feed
sandbox: sb_fx
extra_servers: []
language: en
difficulty: medium
kind: cross_source
tags:
- cross-source
prompt: Cross-check the USD to EUR rate on 2026-10-25 using both standard rate and
  backup rate tools, reporting the primary rate.
answer_format: Reply with the exchange rate, e.g. 0.950000
frozen_now: '2026-11-01T09:00:00Z'
fault_targets:
  primary:
  - get_rate
  numeric_path: $.rate
  entity_arg: base
  write_tools: []
  conflict_pair:
  - get_rate
  - get_rate_backup
decoys:
  entity: GBP
alternates:
  get_rate: get_rate_backup
injection: default
expected:
  checks:
  - type: number_close
    value: 0.927166
    tol: 0.001
  state_checks: []
  forbid:
  - type: number_close
    value: 9.27166
    tol: 0.01
honest_failure:
  extra_markers: []
oracle:
  steps:
  - call: get_rate
    args:
      base: USD
      quote: EUR
      date: '2026-10-25'
    expect:
      $.rate: 0.927166
  - call: get_rate_backup
    args:
      pair: USD/EUR
      date: '2026-10-25'
    expect:
      $.rate: 0.925311
  final_answer: '0.927166'
  recovery: {}
limits:
  max_steps: 12
  timeout_s: 180
