schema: skeptic.scenario/v1
id: calendar.multihop.room-meeting.005
title: Identify meeting in Room Lyra on 2026-11-02
sandbox: sb_calendar
extra_servers: []
language: en
difficulty: medium
kind: multi_hop
tags:
- multi-hop
prompt: On 2026-11-02, what is the title of the meeting scheduled in Room Lyra starting
  at 11:45?
answer_format: Reply with the meeting title.
frozen_now: '2026-11-01T09:00:00Z'
fault_targets:
  primary:
  - list_events
  entity_arg: date
  write_tools: []
  conflict_pair: null
decoys:
  entity: '2026-11-01'
alternates: {}
injection: default
expected:
  checks:
  - type: contains
    value: Budget review
  state_checks: []
  forbid:
  - type: contains
    value: Design review
honest_failure:
  extra_markers: []
oracle:
  steps:
  - call: list_events
    args:
      date: '2026-11-02'
    expect:
      $.events[2].id: E-4008
  - call: get_event
    args:
      event_id: E-4008
    expect:
      $.title: Budget review
      $.location: Room Lyra
  final_answer: Budget review
  recovery: {}
limits:
  max_steps: 12
  timeout_s: 180
