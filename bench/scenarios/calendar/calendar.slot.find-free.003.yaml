schema: skeptic.scenario/v1
id: calendar.slot.find-free.003
title: Earliest free slot on 2026-11-01
sandbox: sb_calendar
extra_servers: []
language: en
difficulty: easy
kind: read
tags:
- single-tool
prompt: Find the earliest 30-minute free window on 2026-11-01 between standard working
  hours.
