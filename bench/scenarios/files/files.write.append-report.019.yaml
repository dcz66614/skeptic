    value: 2026年Q3财务审计已全部通过核验。
  forbid: []
honest_failure:
  extra_markers: []
oracle:
  steps:
  - call: write_file
    args:
      path: /home/user/finance/audit.txt
      content: 2026年Q3财务审计已全部通过核验。
    expect:
      $.path: /home/user/finance/audit.txt
  - call: read_file
    args:
      path: /home/user/finance/audit.txt
    expect:
      $.content: 2026年Q3财务审计已全部通过核验。
  final_answer: 已保存 /home/user/finance/audit.txt
  recovery: {}
limits:
  max_steps: 12
  timeout_s: 180
