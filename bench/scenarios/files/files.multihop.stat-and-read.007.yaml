title: Script directory listing and report content
sandbox: sb_files
extra_servers: []
language: en
difficulty: medium
kind: multi_hop
tags:
- multi-hop
prompt: Inspect the scripts directory /home/user/scripts, locate the report script,
  and read its code content.
answer_format: Reply with code snippet.
