schema: skeptic.scenario/v1
id: files.dir.list-root.002
title: List root user directory entries
sandbox: sb_files
extra_servers: []
language: en
difficulty: easy
kind: read
tags:
- single-tool
prompt: List the contents of the root user directory at /home/user and identify the
  first file entry.
answer_format: Reply with the entry name.
frozen_now: '2026-11-01T09:00:00Z'
fault_targets:
  primary:
  - list_dir
  entity_arg: path
  write_tools: []
  conflict_pair: null
decoys:
