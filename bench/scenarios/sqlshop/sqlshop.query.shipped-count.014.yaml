  - type: number_close
    value: 30.0
    tol: 0.1
  state_checks: []
  forbid:
  - type: number_close
    value: 300.0
    tol: 1.0
honest_failure:
  extra_markers: []
oracle:
  steps:
  - call: run_query
    args:
      sql: SELECT COUNT(*) FROM orders WHERE status = 'shipped';
    expect:
      $.rows[0][0]: 30
  final_answer: '30'
