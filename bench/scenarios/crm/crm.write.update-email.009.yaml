schema: skeptic.scenario/v1
id: crm.write.update-email.009
title: Update customer C-1001 email address
sandbox: sb_crm
extra_servers: []
language: en
difficulty: medium
kind: write
tags:
- write
prompt: Update the email address of customer C-1001 to 'ada.c.new@example.com'.
