schema: skeptic.scenario/v1
id: crm.multihop.city-customers.016
title: 按上海城市检索并获取客户档案
sandbox: sb_crm
extra_servers: []
language: zh
difficulty: medium
kind: multi_hop
tags:
- multi-hop
