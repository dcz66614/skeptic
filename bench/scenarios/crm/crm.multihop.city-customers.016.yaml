  - get_customer
  entity_arg: customer_id
  write_tools: []
decoys:
  entity: C-1001
alternates: {}
injection: default
expected:
  checks:
  - type: contains
    value: Chloé Kowalski
  state_checks: []
  forbid:
  - type: contains
    value: John Doe
honest_failure:
  extra_markers: []
oracle:
  steps:
  - call: search_customers
    args:
      query: Shanghai
