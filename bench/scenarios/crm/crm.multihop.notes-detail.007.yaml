schema: skeptic.scenario/v1
id: crm.multihop.notes-detail.007
title: Get customer details and inspect notes
sandbox: sb_crm
extra_servers: []
language: en
difficulty: medium
kind: multi_hop
tags:
- multi-hop
prompt: Verify customer C-1002 exists and fetch their notes. Does C-1002 have notes
  recorded?
