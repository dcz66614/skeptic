schema: skeptic.scenario/v1
id: crm.cross.search-get.017
title: 多源核验客户C-1005邮箱一致性
sandbox: sb_crm
extra_servers: []
language: zh
difficulty: medium
kind: cross_source
tags:
- cross-source
