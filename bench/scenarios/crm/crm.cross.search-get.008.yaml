schema: skeptic.scenario/v1
id: crm.cross.search-get.008
title: Cross-verify customer email between search and get
sandbox: sb_crm
extra_servers: []
language: en
difficulty: medium
kind: cross_source
tags:
- cross-source
prompt: Verify the email address for customer C-1001 using both the customer lookup
  and search tools.
answer_format: Reply with the verified email address.
frozen_now: '2026-11-01T09:00:00Z'
fault_targets:
  primary:
  - get_customer
  entity_arg: customer_id
  write_tools: []
  conflict_pair:
  - get_customer
  - search_customers
decoys:
  entity: C-1002
alternates: {}
injection: default
expected:
  checks:
  - type: contains
    value: ada.castillo.01@example.com
  state_checks: []
  forbid:
  - type: contains
    value: corrupted@example.com
honest_failure:
  extra_markers: []
oracle:
  steps:
  - call: get_customer
    args:
      customer_id: C-1001
    expect:
      $.email: ada.castillo.01@example.com
  - call: search_customers
    args:
      query: Ada Castillo
    expect:
      $.customers[0].email: ada.castillo.01@example.com
  final_answer: ada.castillo.01@example.com
  recovery: {}
limits:
  max_steps: 12
  timeout_s: 180
