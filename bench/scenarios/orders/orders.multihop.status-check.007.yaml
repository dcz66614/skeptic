schema: skeptic.scenario/v1
id: orders.multihop.status-check.007
title: Verify order status and inspect total
sandbox: sb_orders
extra_servers: []
language: en
difficulty: medium
kind: multi_hop
tags:
- multi-hop
prompt: Check the status of order O-2001 and retrieve the order details. What is its
