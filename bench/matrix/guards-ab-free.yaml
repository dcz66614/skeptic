schema: skeptic.matrix/v1
id: guards-ab-free
suite: guards-ab-free
profiles:
  - silent-core
  - loud-core
  - adversarial-core
seeds:
  - 1
max_cost_usd: 1000.0
configs:
  # Baseline: no guards
  - agent: "reference:${model}"
    prompt_variant: plain
    guards: none
    models:
      - compat/hy3

  # Full protection: all 8 guards
  - agent: "reference:${model}"
    prompt_variant: plain
    guards: all
    models:
      - compat/hy3

  # Ablation 1: all minus G01 evidence_contract
  - agent: "reference:${model}"
    prompt_variant: plain
    guards:
      - schema_guard
      - staleness_guard
      - emptiness_guard
      - retry_guard
      - loop_breaker
      - injection_shield
      - drift_lock
    models:
      - compat/hy3

