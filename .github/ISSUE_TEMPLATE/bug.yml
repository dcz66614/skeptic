name: Bug
description: 缺陷报告
title: "[bug] "
body:
  - type: textarea
    id: what
    attributes:
      label: 现象
      description: 实际看到的结果。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望
      description: 规格或任务卡要求的结果。
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现
      description: 命令和输出。不要粘贴密钥。
    validations:
      required: true
