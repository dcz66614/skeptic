# D61 FakeLLM LangGraph workflow.
name: Example LangGraph

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  langgraph-example:
    name: FakeLLM LangGraph example
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --locked --all-extras

      - name: Run LangGraph example script
        run: uv run python examples/02-langgraph/run.py
