schema: skeptic.config/v1
project: langgraph-example
servers:
  weather:
    transport: stdio
    command:
      - python
      - -m
      - skeptic_agent.sandboxes.sb_weather
profile: none
guards: []
record:
  dir: .skeptic/cassettes
  redact_keys:
    - authorization
    - cookie
    - api_key
    - token
    - secret
    - password
gate:
  min_sks: 70
  max_fsr: 0.10
  max_icr: 0.00
budget:
  max_cost_usd_per_run: 5
judge:
  enabled: false
  model: null
